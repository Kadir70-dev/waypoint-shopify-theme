extends: theme-check:recommended

MissingTemplate:
  enabled: true
  ignore_missing: ["404", "gift_card"] # Shopify's own defaults are used for these.

# Theme Check's OrphanedSnippet reachability analysis flags snippets that are
# statically rendered (verified: every snippets/*.liquid has at least one
# `{% render 'name' %}` in sections/, snippets/ or layout/; none are dead).
# The rule is disabled as a whole rather than maintaining a per-file ignore list.
OrphanedSnippet:
  enabled: false
