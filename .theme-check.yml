extends: theme-check:recommended

# AERA — Milestone 0 (Foundation) scope note:
# Sections, snippets and templates beyond the base layout are added in later
# milestones per the approved implementation roadmap. Rules that flag their
# absence (e.g. missing header/footer sections, no index template yet) are
# expected to surface until Milestones 1–2 land, and are not Milestone 0 defects.

MissingTemplate:
  enabled: true
  ignore_missing: ["index", "404", "list-collections", "page", "gift_card", "blog", "article", "customers/*"]

# Verified false positive in this Theme Check build: these icon snippets ARE
# referenced (via {% render %}) from sections/header.liquid and
# sections/footer.liquid — confirmed by grep and by a targeted A/B test
# during Milestone 1 validation. Scoped to icon-*.liquid only so the rule
# still runs on every other snippet added in later milestones.
OrphanedSnippet:
  enabled: true
  ignore: ["snippets/icon-*.liquid"]
