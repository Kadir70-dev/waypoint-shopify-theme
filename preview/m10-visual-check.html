<!DOCTYPE html>
<meta charset="utf-8">
<title>AERA — Milestone 10 visual spot-check</title>
<!--
  Static visual mockup linking the REAL theme CSS files, same pattern as
  the other preview/*.html mockups. Isolates the two new Milestone 10
  markup patterns that reuse existing classes in a new combination:
  the gift-card recipient fieldset and the selling-plan pill group.
-->
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="../assets/base.css">
<link rel="stylesheet" href="../assets/component-product-card.css">
<style>
  /* Real .option-selector__pill rules are scoped to #shopify-section-X in
     main-product.liquid's own <style> block, not a shared CSS file —
     copied verbatim (not approximated) so this mockup actually proves
     the checked-state styling without loading the whole PDP section. */
  .option-selector { border: 0; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 10px; }
  .option-selector__values { display: flex; flex-wrap: wrap; gap: 8px; }
  .option-selector__pill {
    display: inline-flex;
    align-items: center;
    padding: 9px 16px;
    border: 1px solid var(--border-strong);
    font-family: var(--font-display);
    font-size: 12px;
    letter-spacing: .06em;
    text-transform: uppercase;
    cursor: pointer;
  }
  .option-selector__input:checked + .option-selector__pill {
    background: var(--cta-bg);
    color: var(--cta-text);
    border-color: var(--cta-bg);
  }
  .option-selector__input:focus-visible + .option-selector__pill {
    outline: var(--focus-ring);
    outline-offset: 2px;
  }
  body { background: #0E0F0D; color: #F5F4EF; padding: 40px; font-family: Arial, sans-serif; max-width: 420px; }
  section { margin-bottom: 50px; }
  h2 { font-size: 14px; text-transform: uppercase; letter-spacing: .04em; color: #999; }
</style>

<section>
  <h2>1. Selling plan pills (subscription vs one-time)</h2>
  <fieldset class="option-selector">
    <legend class="eyebrow">Purchase options</legend>
    <div class="option-selector__values">
      <input type="radio" id="pill-onetime" name="selling_plan" checked class="visually-hidden option-selector__input">
      <label for="pill-onetime" class="option-selector__pill">One-time purchase</label>
      <input type="radio" id="pill-sub" name="selling_plan" class="visually-hidden option-selector__input">
      <label for="pill-sub" class="option-selector__pill">Subscribe &amp; save 10%</label>
    </div>
  </fieldset>
</section>

<section>
  <h2>2. Gift card recipient fieldset</h2>
  <fieldset style="display:flex;flex-direction:column;gap:10px;border:1px solid var(--border-strong);padding:14px;margin-top:4px">
    <label style="display:flex;align-items:center;gap:8px;font-size:13px">
      <input type="checkbox">
      This is a gift
    </label>
    <div style="display:flex;flex-direction:column;gap:10px">
      <div style="display:flex;flex-direction:column;gap:4px">
        <label class="eyebrow">Recipient email</label>
        <input type="email" style="background:var(--surface-2);border:1px solid var(--border-strong);color:var(--text);padding:10px 12px;font-family:var(--font-body);font-size:14px;">
      </div>
      <div style="display:flex;flex-direction:column;gap:4px">
        <label class="eyebrow">Send on (optional)</label>
        <input type="date" style="background:var(--surface-2);border:1px solid var(--border-strong);color:var(--text);padding:10px 12px;font-family:var(--font-body);font-size:14px;">
      </div>
    </div>
  </fieldset>
</section>
