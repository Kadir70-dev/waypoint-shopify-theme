<!DOCTYPE html>
<meta charset="utf-8">
<title>AERA — Milestone 9 visual spot-check</title>
<!--
  Static visual mockup linking the REAL theme CSS files, same pattern as
  the other preview/*.html mockups. Isolates the Milestone 9 additions
  that are hard to prove from source alone: the sold-out/sale product
  card badges and the collection sort-by control.
-->
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="../assets/base.css">
<link rel="stylesheet" href="../assets/component-collection.css">
<link rel="stylesheet" href="../assets/component-product-card.css">
<style>
  body { background: #0E0F0D; color: #F5F4EF; padding: 40px; font-family: Arial, sans-serif; }
  section { margin-bottom: 60px; }
  h2 { font-size: 14px; text-transform: uppercase; letter-spacing: .04em; color: #999; }
  .row { display: flex; gap: 24px; }
  .pcard__media { width: 220px; height: 220px; background: #333; }
</style>

<section>
  <h2>1. Collection meta bar — sort-by control + filter trigger</h2>
  <div class="collection-grid__meta" style="max-width:600px">
    <span class="eyebrow">24 products</span>
    <div style="display:flex;align-items:center;gap:12px">
      <form class="collection-sort">
        <select>
          <option>Featured</option>
          <option selected>Price, low to high</option>
          <option>Price, high to low</option>
          <option>Alphabetically, A-Z</option>
          <option>Date, new to old</option>
        </select>
      </form>
      <button type="button" class="collection-grid__filter-trigger">Filters</button>
    </div>
  </div>
</section>

<section>
  <h2>2. Product card badges — Sold Out (muted) vs Sale (accent)</h2>
  <div class="row">
    <div class="pcard">
      <div class="pcard__media">
        <span class="badge pcard__badge badge--muted">Sold Out</span>
      </div>
      <div class="pcard__body">
        <span class="pcard__name">Summit 45</span>
        <span class="pcard__price"><span>€249,00</span></span>
      </div>
    </div>
    <div class="pcard">
      <div class="pcard__media">
        <span class="badge pcard__badge">Sale</span>
      </div>
      <div class="pcard__body">
        <span class="pcard__name">Ridge 30</span>
        <span class="pcard__price"><span class="compare-at">€199,00</span><span>€149,00</span></span>
      </div>
    </div>
  </div>
</section>
