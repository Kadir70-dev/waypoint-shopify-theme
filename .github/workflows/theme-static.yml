name: Shopify Theme Static Integrity

on:
  pull_request:
    paths:
      - 'templates/**'
      - 'sections/**'
      - 'config/**'
      - 'listings/**'
      - 'scripts/validate_theme_json.py'
      - '.github/workflows/theme-static.yml'
  push:
    branches: [main]
    paths:
      - 'templates/**'
      - 'sections/**'
      - 'config/**'
      - 'listings/**'
      - 'scripts/validate_theme_json.py'
      - '.github/workflows/theme-static.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  json-integrity:
    name: JSON and template references
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate theme JSON and template block references
        run: python scripts/validate_theme_json.py
