name: Shopify Theme Static Integrity

on:
  pull_request:
    paths:
      - 'templates/**'
      - 'sections/**'
      - 'config/**'
      - 'listings/**'
      - 'scripts/validate_theme_json.py'
      - 'assets/branch-locations.js'
      - 'scripts/test_branch_locations.cjs'
      - 'assets/component-branch-locations.css'
      - '.github/workflows/theme-static.yml'
  push:
    branches: [main]
    paths:
      - 'templates/**'
      - 'sections/**'
      - 'config/**'
      - 'listings/**'
      - 'scripts/validate_theme_json.py'
      - 'assets/branch-locations.js'
      - 'scripts/test_branch_locations.cjs'
      - 'assets/component-branch-locations.css'
      - '.github/workflows/theme-static.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  json-integrity:
    name: JSON and template references
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate JSON templates and Shopify section schemas
        run: python scripts/validate_theme_json.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate branch locations JavaScript syntax
        run: |
          node --check assets/branch-locations.js
          node scripts/test_branch_locations.cjs
